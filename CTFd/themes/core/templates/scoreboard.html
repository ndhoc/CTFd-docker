{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" data-cfasync="false" href="{{ url_for('views.themes', path='css/scoreboard-buu-v1.min.css') }}?v=20260411c">
<div class="jumbotron">
	<div class="container">
		<h1>Scoreboard</h1>
	</div>
</div>
<div class="container">
	{% include "components/errors.html" %}

	<div id="score-graph" class="row d-flex align-items-center">
		<div class="col-md-12 text-center">
			<i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
		</div>
	</div>

	<div class="row mt-2 mb-3">
		<div class="col-md-12 text-center">
			<p id="scoreboard-place-text" class="mb-0"></p>
		</div>
	</div>

	<div id="scoreboard-panel" class="row mt-4">
		<div class="col-md-12">
			<ul id="scoreboard-tabs" class="nav nav-tabs mb-3"></ul>
			<div class="table-responsive">
				<table class="table table-striped scoreboard-table">
					<thead>
						<tr>
							<th scope="col">Place</th>
							<th scope="col">{{ get_mode_as_word(capitalize=True) }}</th>
							<th scope="col">Affiliation</th>
							<th scope="col">Score</th>
							<th scope="col">Solves</th>
							<th scope="col">Last Point Time</th>
						</tr>
					</thead>
					<tbody id="scoreboard-body"></tbody>
				</table>
			</div>
			<div id="scoreboard-empty" class="alert alert-secondary d-none mb-0">No scoreboard rows found.</div>
			<nav class="mt-3" aria-label="Scoreboard pagination">
				<ul id="scoreboard-pagination" class="pagination justify-content-center mb-0"></ul>
			</nav>
		</div>
	</div>
</div>
{% endblock %}

{% block entrypoint %}
	<script defer src="{{ url_for('views.themes', path='js/pages/main.min.js') }}"></script>
	<script data-cfasync="false" defer src="{{ url_for('views.themes', path='js/echarts.bundle.min.js') }}"></script>
	<script data-cfasync="false" defer src="{{ url_for('views.themes', path='js/pages/scoreboard.min.js') }}?v=20260411n"></script>
	<script data-cfasync="false" defer src="{{ url_for('views.themes', path='js/pages/scoreboard-buu-v1.min.js') }}?v=20260411o"></script>
{% endblock %}
