{% extends "base.html" %}

{% block stylesheets %}
	<link rel="stylesheet" href="{{ url_for('views.themes', path='css/challenge-board.css') }}">
	<link rel="stylesheet" data-cfasync="false" href="{{ url_for('views.themes', path='css/challenges-buu-v2.min.css') }}?v=20260411q">
{% endblock %}

{% block content %}
<div class="jumbotron">
	<div class="container">
		<h1>Challenges</h1>
	</div>
</div>

<div class="modal fade" id="challenge-window" tabindex="-1" role="dialog">
</div>

<div class="container">
	<div class="row">
		<div class="col-md-12">
			{% include "components/errors.html" %}
		</div>
	</div>

	<div class="challenge-toolbar row g-2 align-items-center mb-3">
		<div class="col-md-3 mb-2 mb-md-0">
			<select id="challenge-search-field" class="form-control w-100">
				<option value="name" selected>Name</option>
				<option value="description">Description</option>
				<option value="tag">Tag</option>
			</select>
		</div>
		<div class="col-md-7 mb-2 mb-md-0">
			<input type="text" id="challenge-search-input" class="form-control w-100" placeholder="Search for matching challenge">
		</div>
		<div class="col-md-2">
			<button id="challenge-search-button" class="btn btn-primary w-100">
				<i class="fas fa-search" aria-hidden="true"></i>
			</button>
		</div>
	</div>

	<div id="challenges-board" class="row">
		<div class="col-lg-3 mb-3 mb-lg-0">
			<div class="category-sidebar p-3">
				<h5 class="mb-3">Categories</h5>
				<div id="challenge-categories" class="nav flex-column nav-pills"></div>
			</div>
		</div>
		<div class="col-lg-9">
			<div class="challenge-grid-header d-flex align-items-center justify-content-between mb-3">
				<h2 id="challenge-current-category" class="mb-0">All</h2>
				<select id="challenge-sort" class="form-control challenge-sort-select">
					<option value="rank" selected>Rank</option>
					<option value="name_asc">Name A-Z</option>
					<option value="name_desc">Name Z-A</option>
					<option value="value_asc">Points Low-High</option>
					<option value="value_desc">Points High-Low</option>
				</select>
			</div>
			<div id="challenge-grid" class="challenge-grid row"></div>
			<div id="challenge-empty" class="alert alert-secondary d-none mt-3 mb-0">No challenges found.</div>
			<nav class="mt-4" aria-label="Challenge pagination">
				<ul id="challenge-pagination" class="pagination justify-content-center flex-wrap mb-0"></ul>
			</nav>
		</div>
	</div>

	<div id="challenge-loading" class="min-vh-50 d-flex align-items-center">
		<div class="text-center w-100">
			<i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}

{% block entrypoint %}
	<script defer src="{{ url_for('views.themes', path='js/pages/main.js') }}"></script>
	<script data-cfasync="false" defer src="{{ url_for('views.themes', path='js/pages/challenges-buu-v2.min.js') }}?v=20260411q"></script>
{% endblock %}
